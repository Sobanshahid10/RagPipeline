<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">RAG Pipeline — a personal project by Muhammad Soban</title>
  <desc id="desc">Document chat and a public knowledge book, connected through retrieval-augmented generation.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#202228"/><stop offset="1" stop-color="#0c0d0e"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="22" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1279" height="379" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="63" fill="#9ca3af" font-size="12" letter-spacing="4">BUILD · RETRIEVE · EXPLORE</text>
    <text x="60" y="146" fill="#f3f4f6" font-size="66" font-weight="700" letter-spacing="-3">RAG Pipeline</text>
    <text x="64" y="190" fill="#b6bbc4" font-size="21">Ask your documents. Explore a public knowledge book.</text>
    <text x="64" y="230" fill="#8c929e" font-size="15">A personal learning project by Muhammad Soban</text>
    <g fill="#1e2025" stroke="#ffffff" stroke-opacity=".16">
      <rect x="64" y="283" width="86" height="32" rx="16"/>
      <rect x="160" y="283" width="86" height="32" rx="16"/>
      <rect x="256" y="283" width="112" height="32" rx="16"/>
      <rect x="378" y="283" width="106" height="32" rx="16"/>
    </g>
    <g fill="#d1d5db" font-size="12" text-anchor="middle"><text x="107" y="304">FastAPI</text><text x="203" y="304">Next.js</text><text x="312" y="304">PostgreSQL</text><text x="431" y="304">MIT License</text></g>
    <g transform="translate(858 66)">
      <path d="M 124 62 V 103 M 124 103 H 32 V 139 M 124 103 H 216 V 139 M 32 185 V 217 H 124 M 216 185 V 217 H 124" fill="none" stroke="#6b7280" stroke-width="1.5"/>
      <rect x="34" width="180" height="62" rx="12" fill="#e5e7eb"/><text x="124" y="37" fill="#0c0d0e" font-size="15" text-anchor="middle" font-weight="700">A question</text>
      <g fill="#1e2025" stroke="#4b505b"><rect x="-25" y="139" width="114" height="46" rx="10"/><rect x="159" y="139" width="114" height="46" rx="10"/></g>
      <g fill="#d1d5db" text-anchor="middle" font-size="12"><text x="32" y="167">Documents</text><text x="216" y="167">Public book</text></g>
      <circle cx="124" cy="217" r="4" fill="#e5e7eb"/>
      <text x="124" y="251" fill="#9ca3af" font-size="12" text-anchor="middle" letter-spacing="1">CONTEXT → ANSWER</text>
    </g>
  </g>
</svg>
