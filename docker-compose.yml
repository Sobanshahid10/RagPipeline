services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: always
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "Production RAG Engine"
      DATABASE_URL: postgresql+asyncpg://rag_user:rag_password@postgres:5432/rag_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super_secret_jwt_key_change_in_production_2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_celery_worker
    restart: always
    command: celery -A app.celery_app worker --loglevel=info -Q high_priority,low_priority --concurrency=4
    environment:
      PROJECT_NAME: "Production RAG Engine"
      DATABASE_URL: postgresql+asyncpg://rag_user:rag_password@postgres:5432/rag_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super_secret_jwt_key_change_in_production_2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: rag_jaeger
    restart: always
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  postgres_data:
  redis_data:
